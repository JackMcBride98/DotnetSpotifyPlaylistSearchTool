---
name: Manual Production Deployment
on:
  workflow_dispatch:
env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY_API: playlist-search-tool-api
  ECR_REPOSITORY_MIGRATE: playlist-search-tool-migrations
  ECS_CLUSTER: playlist-search-tool-cluster
  ECS_SERVICE: playlist-search-tool-service
  AWS_ROLE_ARN: arn:aws:iam::687979656894:role/playlist-search-tool-github-actions-role

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 1. PROVISION / UPDATE INFRASTRUCTURE (OpenTofu)
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
      - name: OpenTofu Apply
        working-directory: ./infrastructure
        env:
          TF_VAR_spotify_client_id: ${{ secrets.SPOTIFY_CLIENT_ID }}
          TF_VAR_spotify_client_secret: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          TF_VAR_spotify_redirect_uri: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_port: ${{ secrets.DB_PORT }}
        run: |
          tofu init
          tofu apply -auto-approve

      - name: Get Infrastructure Outputs
        id: tf-outputs
        working-directory: ./infrastructure
        run: |
          echo "subnet_1=$(tofu output -json private_subnet_ids | jq -r '.[0]')" >> $GITHUB_OUTPUT
          echo "subnet_2=$(tofu output -json private_subnet_ids | jq -r '.[1]')" >> $GITHUB_OUTPUT
          echo "ecs_sg=$(tofu output -raw ecs_tasks_security_group_id)" >> $GITHUB_OUTPUT

      # 2. BUILD FRONTEND AND PUBLISH BACKEND (Using Cake Task)
      - name: Build and Publish via Cake
        uses: cake-build/cake-action@v3
        with:
          project-path: build/Build.csproj
          target: PublishBackend
          verbosity: Normal

      - name: Publish Migrations via Cake
        uses: cake-build/cake-action@v3
        with:
          project-path: build/Build.csproj
          target: PublishDatabaseMigrations
          verbosity: Normal

      # 3. LOGIN TO AMAZON ECR & PUSH DOCKER IMAGES
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and Push Migration Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Migrations.Dockerfile -t $REGISTRY/$ECR_REPOSITORY_MIGRATE:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY_MIGRATE:$IMAGE_TAG
      - name: Build and Push API Image (Bundled with Frontend inside /publish)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Ensure you have a Dockerfile at the root or point to it that bundles the publish output
          docker build -f Dockerfile -t $REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG

      # 4. EXECUTE DATABASE MIGRATIONS SECURELY INSIDE PRIVATE VPC
      - name: Register & Run Database Migrations Task
        run: |
          # 1. Download current migration task definition template
          aws ecs describe-task-definition --task-definition playlist-search-tool-migrations --query taskDefinition > migration-task-def.json

          # 2. Update the image placeholder with our newly built image tag using the official action
          # (Or use jq to inject the image URI directly)
          CONFIGURED_TASK_DEF=$(npx --yes jq --arg IMAGE \
          "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_MIGRATE }}:${{ github.sha }}" \
          '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' migration-task-def.json)
          echo "$CONFIGURED_TASK_DEF" > final-migration-task-def.json

          # 3. Register a new revision with the fresh image
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://final-migration-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "Running migration task using revision: $NEW_TASK_DEF_ARN"

          # 4. Run the task on Fargate inside the private subnets and wait for it to exit successfully
          # Note: Adjust your security group IDs and private subnet IDs to match your setup variables or reference them dynamically
          aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition $NEW_TASK_DEF_ARN \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.get-subnets.outputs.subnet_id_1 }}, ${{ steps.get-subnets.outputs.subnet_id_2 }}],securityGroups=[${{ steps.get-sgs.outputs.ecs_sg }}],assignPublicIp=ENABLED}" \
            --started-by "github-actions-migration" > run-task-output.json

          # Extract task ID to monitor it
          TASK_ID=$(jq -r '.tasks[0].taskArn' run-task-output.json)
          echo "Started migration task: $TASK_ID. Waiting for completion..."

          # 5. Wait for the migration container to finish execution (exits with 0 on success)
          aws ecs wait tasks-stopped --cluster ${{ env.ECS_CLUSTER }} --tasks $TASK_ID

          # 6. Check exit code to ensure migrations succeeded without errors
          EXIT_CODE=$(aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER }} --tasks $TASK_ID --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ Database migrations failed with exit code $EXIT_CODE"
            exit 1
          else
            echo "✅ Database migrations completed successfully!"
          fi

      # 5. Download the current task definition from AWS into a file
      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition playlist-search-tool-api --query \
          taskDefinition > task-definition.json

      # 6. RENDER TASK DEFINITION (Automatically swaps the image tag in the downloaded file)
      - name: Render Amazon ECS task definition
        id: render-app
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ github.sha }}

      # 7. DEPLOY TO ECS SERVICE (Registers new revision and rolls out safely)
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-app.outputs.task-definition }}
          service: playlist-search-tool-service
          cluster: playlist-search-tool-cluster
          wait-for-service-stability: true
          wait-max-delay-seconds: 15
