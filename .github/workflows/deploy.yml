---
name: Manual Production Deployment
on:
  workflow_dispatch:
env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY_API: playlist-search-tool-api
  ECR_REPOSITORY_MIGRATE: playlist-search-tool-migrations
  ECS_CLUSTER: playlist-search-tool-cluster
  ECS_SERVICE: playlist-search-tool-service
  AWS_ROLE_ARN: arn:aws:iam::687979656894:role/playlist-search-tool-github-actions-role

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 1. PROVISION / UPDATE INFRASTRUCTURE (OpenTofu)
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
      - name: OpenTofu Apply
        working-directory: ./infrastructure
        env:
          TF_VAR_spotify_client_id: ${{ secrets.SPOTIFY_CLIENT_ID }}
          TF_VAR_spotify_client_secret: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          TF_VAR_spotify_redirect_uri: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_port: ${{ secrets.DB_PORT }}
        run: |
          tofu init
          tofu apply -auto-approve

      # 2. BUILD FRONTEND AND PUBLISH BACKEND (Using Cake Task)
      - name: Build and Publish via Cake
        uses: cake-build/cake-action@v3
        with:
          project-path: build/Build.csproj
          target: PublishBackend
          verbosity: Normal

      - name: Publish Migrations via Cake
        uses: cake-build/cake-action@v3
        with:
          project-path: build/Build.csproj
          target: PublishDatabaseMigrations
          verbosity: Normal

      # 3. LOGIN TO AMAZON ECR & PUSH DOCKER IMAGES
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and Push Migration Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Migrations.Dockerfile -t $REGISTRY/$ECR_REPOSITORY_MIGRATE:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY_MIGRATE:$IMAGE_TAG
      - name: Build and Push API Image (Bundled with Frontend inside /publish)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Ensure you have a Dockerfile at the root or point to it that bundles the publish output
          docker build -f Dockerfile -t $REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG

      # 4. EXECUTE DATABASE MIGRATIONS
      - name: Run Database Migrations
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: |
          dotnet run --project SpotifyPlaylistSearchTool.Database/SpotifyPlaylistSearchTool.Database.csproj \
          -- "$DATABASE_CONNECTION_STRING"

      # 5. UPDATE ECS SERVICE (Trigger Rolling Deployment)
      - name: Update ECS API Service with Git SHA
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ github.sha }}
        run: |
          echo "Fetching current task definition..."
          aws ecs describe-task-definition --task-definition playlist-search-tool-api --query taskDefinition > task-def.json

          echo "Cleaning up system metadata from task definition..."
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-def.json > cleaned-task-def.json

          echo "Injecting new image URI: $IMAGE_URI"
          jq --arg IMAGE "$IMAGE_URI" '.containerDefinitions[0].image = $IMAGE' cleaned-task-def.json > final-task-def.json

          echo "Registering new task definition revision..."
          NEW_TASK_DEF=$(aws ecs register-task-definition --cli-input-json file://final-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "New task definition registered: $NEW_TASK_DEF"

          echo "Updating ECS service..."
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $NEW_TASK_DEF \
            --desired-count 1 \
            --force-new-deployment
