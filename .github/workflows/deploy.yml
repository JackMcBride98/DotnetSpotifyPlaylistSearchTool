name: Manual Production Deployment
on:
  workflow_dispatch:
env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY_API: playlist-search-tool-api
  ECR_REPOSITORY_MIGRATE: playlist-search-tool-migrations
  ECS_CLUSTER: playlist-search-tool-cluster
  ECS_SERVICE: playlist-search-tool-service
  AWS_ROLE_ARN: arn:aws:iam::687979656894:role/playlist-search-tool-github-actions-role

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 1. PROVISION / UPDATE INFRASTRUCTURE (OpenTofu)
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
      - name: OpenTofu Apply
        working-directory: ./infrastructure
        env:
          TF_VAR_spotify_client_id: ${{ secrets.SPOTIFY_CLIENT_ID }}
          TF_VAR_spotify_client_secret: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          TF_VAR_spotify_redirect_uri: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_port: ${{ secrets.DB_PORT }}
        run: |
          tofu init
          tofu apply -auto-approve

      - name: Get Infrastructure Outputs
        id: tf-outputs
        working-directory: ./infrastructure
        run: |
          echo "subnet_1=$(tofu output -json public_subnet_ids | jq -r '.[0]')" >> $GITHUB_OUTPUT
          echo "subnet_2=$(tofu output -json public_subnet_ids | jq -r '.[1]')" >> $GITHUB_OUTPUT
          echo "ecs_sg=$(tofu output -raw ecs_tasks_security_group_id)" >> $GITHUB_OUTPUT

      # 2. BUILD FRONTEND AND PUBLISH BACKEND (Using Cake Task)
      - name: Build and Publish via Cake
        uses: cake-build/cake-action@v3
        with:
          project-path: build/Build.csproj
          target: PublishBackend
          verbosity: Normal

      - name: Publish Migrations via Cake
        uses: cake-build/cake-action@v3
        with:
          project-path: build/Build.csproj
          target: PublishDatabaseMigrations
          verbosity: Normal

      # 3. LOGIN TO AMAZON ECR & PUSH DOCKER IMAGES
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and Push Migration Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Migrations.Dockerfile -t $REGISTRY/$ECR_REPOSITORY_MIGRATE:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY_MIGRATE:$IMAGE_TAG
      - name: Build and Push API Image (Bundled with Frontend inside /publish)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile -t $REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG

      # 4. DOWNLOAD, RENDER & REGISTER MIGRATION TASK DEFINITION
      - name: Download Migration Task Definition
        run: |
          aws ecs describe-task-definition --task-definition playlist-search-tool-migrations --query taskDefinition > migration-task-def.json

      - name: Render Migration Task Definition
        id: render-migration
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: migration-task-def.json
          container-name: migrations
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_MIGRATE }}:${{ github.sha }}

      - name: Register Migration Task Definition
        id: register-migration
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-migration.outputs.task-definition }}

      # 5. EXECUTE DATABASE MIGRATIONS SECURELY INSIDE PRIVATE VPC
      - name: Run Database Migrations
        uses: geekcell/github-action-aws-ecs-run-task@v5.0.1
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          task-definition: ${{ steps.register-migration.outputs.task-definition-arn }}
          subnet-ids: |
            ${{ steps.tf-outputs.outputs.subnet_1 }}
            ${{ steps.tf-outputs.outputs.subnet_2 }}
          security-group-ids: ${{ steps.tf-outputs.outputs.ecs_sg }}
          assign-public-ip: 'ENABLED'
          tail-logs: true
          override-container: migrations
          task-wait-until-stopped: true
          task-start-max-wait-time: 120
          task-stop-max-wait-time: 300
          task-check-state-delay: 6

      # 6. Download the current task definition from AWS into a file
      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition playlist-search-tool-api --query \
          taskDefinition > task-definition.json

      # 7. RENDER TASK DEFINITION (Automatically swaps the image tag in the downloaded file)
      - name: Render Amazon ECS task definition
        id: render-app
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ github.sha }}

      # 8. DEPLOY TO ECS SERVICE (Registers new revision and rolls out safely)
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-app.outputs.task-definition }}
          service: playlist-search-tool-service
          cluster: playlist-search-tool-cluster
          wait-for-service-stability: true
          wait-max-delay-seconds: 15
